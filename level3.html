<!-- Level 3: Privasi Digital - AR Gamifikasi -->
<!-- Konten AR untuk kuis privasi data pribadi -->

<a-marker type="pattern" url="marker.patt">
  <!-- Tameng privasi berputar -->
  <a-entity position="0 0.8 0">
    <a-cylinder radius="0.5" height="0.08" color="#9c27b0" rotation="0 0 0"
      animation="property:rotation;to:0 360 0;loop:true;dur:5000;easing:linear">
    </a-cylinder>
    <a-text value="🛡️" align="center" position="0 0.15 0" width="2.5"></a-text>
  </a-entity>

  <a-text value="PRIVASI DIGITAL" align="center"
    position="0 1.6 0" color="#9c27b0" width="3.2"></a-text>

  <!-- Panel info data sensitif -->
  <a-plane position="-1.2 0.3 0" width="1.8" height="1.2" color="#f3e5f5">
    <a-text value="DATA SENSITIF:
✗ No. KTP/NIK
✗ No. Rekening
✗ Password
✗ PIN ATM
✗ OTP/kode verifikasi"
      align="left" position="-0.8 0.4 0.01"
      color="#4a148c" width="3.5" wrap-count="24"></a-text>
  </a-plane>

  <!-- Kunci data -->
  <a-entity position="1.2 0.3 0"
    animation="property:rotation;to:0 360 0;loop:true;dur:3000">
    <a-box width="0.3" height="0.3" depth="0.3" color="#673ab7"></a-box>
  </a-entity>

  <a-text value="🔒 ENKRIPSI
DATA AMAN" align="center"
    position="1.2 -0.2 0" color="#7b1fa2" width="2"></a-text>

  <!-- Tombol cek privasi -->
  <a-plane position="0 -0.8 0" width="1.6" height="0.45" color="#9c27b0">
    <a-text value="CEK PENGATURAN PRIVASI" align="center"
      color="white" width="4" position="0 0 0.01"></a-text>
  </a-plane>
</a-marker>
