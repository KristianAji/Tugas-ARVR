<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AR Kuis Password Kuat</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    #hud { position:fixed; top:10px; left:50%; transform:translateX(-50%);
      background:rgba(0,0,0,0.7); color:#fff; padding:8px 16px;
      border-radius:20px; font-family:sans-serif; font-size:14px; z-index:999; }
    #quiz { position:fixed; bottom:0; left:0; right:0; background:#fff;
      padding:16px; border-radius:16px 16px 0 0; font-family:sans-serif;
      display:none; z-index:999; box-shadow:0 -4px 20px rgba(0,0,0,0.15); }
    #quiz h3 { font-size:15px; margin-bottom:12px; color:#111; }
    .opt { display:block; width:100%; padding:10px 14px; margin:6px 0;
      background:#f4f4f4; border:none; border-radius:10px; font-size:13px;
      text-align:left; cursor:pointer; }
    .opt:hover { background:#e8f0fe; }
    #badge { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
      background:linear-gradient(135deg,#4caf50,#2196f3); color:#fff;
      padding:24px 32px; border-radius:20px; text-align:center;
      font-family:sans-serif; display:none; z-index:9999;
      box-shadow:0 8px 32px rgba(0,0,0,0.3); animation:pop 0.4s ease; }
    @keyframes pop { from{transform:translate(-50%,-50%) scale(0.5)} to{transform:translate(-50%,-50%) scale(1)} }
    #score { position:fixed; top:60px; right:10px; background:rgba(0,0,0,0.7);
      color:#fff; padding:6px 12px; border-radius:12px; font-family:sans-serif;
      font-size:13px; z-index:999; }
  </style>
</head>
<body style="margin:0; overflow:hidden;">
  <div id="hud">🔍 Arahkan kamera ke flyer</div>
  <div id="score">⭐ Skor: <span id="pts">0</span></div>

  <div id="quiz">
    <h3 id="q-text">Pertanyaan memuat...</h3>
    <button class="opt" onclick="answer(true)">A) Benar</button>
    <button class="opt" onclick="answer(false)">B) Salah</button>
    <button class="opt" onclick="answer(false)">C) Tergantung situasi</button>
  </div>

  <div id="badge">
    <div style="font-size:48px;">🏆</div>
    <div style="font-size:18px;font-weight:bold;margin:8px 0;">Pahlawan Password!</div>
    <div style="font-size:13px;opacity:0.9;">Kamu menguasai keamanan password</div>
    <button onclick="hideBadge()" style="margin-top:12px;background:rgba(255,255,255,0.2);
      border:none;color:#fff;padding:8px 20px;border-radius:10px;cursor:pointer;">
      Lanjut ➜
    </button>
  </div>

  <a-scene embedded arjs="sourceType:webcam; debugUIEnabled:false;"
    renderer="logarithmicDepthBuffer:true" vr-mode-ui="enabled:false">

    <a-marker type="pattern" url="marker.patt" id="marker">
      <!-- Gembok 3D -->
      <a-entity position="0 1 0" rotation="-90 0 0">
        <a-torus color="#2196f3" radius="0.3" radius-tubular="0.08"
          animation="property:rotation;to:0 360 0;loop:true;dur:3000;easing:linear"></a-torus>
      </a-entity>

      <!-- Batang gembok -->
      <a-cylinder position="0 0.6 0" radius="0.08" height="0.6"
        color="#1565c0" animation="property:position;from:0 0.3 0;to:0 0.7 0;
        loop:true;dir:alternate;dur:800"></a-cylinder>

      <!-- Badan gembok -->
      <a-box position="0 0 0" width="0.7" height="0.5" depth="0.3"
        color="#1976d2"></a-box>

      <!-- Teks judul -->
      <a-text value="🔐 QUIZ PASSWORD" align="center"
        position="0 1.4 0" color="#ffffff" width="3"
        animation="property:rotation;from:0 0 0;to:0 360 0;
        loop:true;dur:6000;easing:linear"></a-text>

      <!-- Tombol mulai -->
      <a-plane position="0 -0.8 0" width="1.4" height="0.4"
        color="#4caf50" class="clickable"
        event-set__click="visible:false"
        onclick-handler
        id="start-btn">
        <a-text value="TAP UNTUK MULAI" align="center"
          color="white" width="4" position="0 0 0.01"></a-text>
      </a-plane>

      <!-- Partikel reward -->
      <a-entity id="particles" position="0 2 0" visible="false">
        <a-sphere position="0.3 0 0" radius="0.05" color="gold"
          animation="property:position;to:-0.3 1 0;dur:1000;loop:3"></a-sphere>
        <a-sphere position="-0.3 0 0" radius="0.05" color="#ff9800"
          animation="property:position;to:0.3 1 0;dur:1200;loop:3"></a-sphere>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
  const questions = [
    { q:"Password 'Pahlawan@Siber2024!' termasuk password kuat?",
      ans: 0, opts:["Benar, kombinasi lengkap","Salah, terlalu panjang","Tergantung situasi"] },
    { q:"Aman menggunakan password yang sama di semua akun?",
      ans: 1, opts:["Ya, lebih mudah diingat","Tidak, sangat berbahaya","Boleh untuk akun tidak penting"] },
    { q:"Apa fungsi 2FA (Two Factor Authentication)?",
      ans: 2, opts:["Membuat password 2x lebih panjang","Menyimpan password di cloud","Lapisan keamanan tambahan selain password"] }
  ];
  let current=0, score=0;
  
  document.getElementById('marker').addEventListener('markerFound', () => {
    document.getElementById('hud').textContent = '✅ Marker terdeteksi! Tap tombol hijau';
    setTimeout(showQuiz, 1500);
  });
  document.getElementById('marker').addEventListener('markerLost', () => {
    document.getElementById('hud').textContent = '🔍 Arahkan kamera ke flyer';
    document.getElementById('quiz').style.display = 'none';
  });

  function showQuiz() {
    if(current >= questions.length) { showBadge(); return; }
    const q = questions[current];
    document.getElementById('q-text').textContent = q.q;
    const opts = document.querySelectorAll('.opt');
    opts.forEach((b,i) => { b.textContent = ['A) ','B) ','C) '][i] + q.opts[i]; b.style.background='#f4f4f4'; });
    document.getElementById('quiz').style.display = 'block';
  }

  function answer(isA) {
    const q = questions[current];
    const btns = document.querySelectorAll('.opt');
    const correctIdx = q.ans;
    btns[correctIdx].style.background = '#c8e6c9';
    if(!isA && correctIdx !== (isA ? 0 : 1)) { btns[isA ? 0 : 1].style.background = '#ffcdd2'; }
    score += (isA === (q.ans === 0)) ? 25 : 0;
    document.getElementById('pts').textContent = score;
    current++;
    setTimeout(() => { document.getElementById('quiz').style.display='none'; showQuiz(); }, 1200);
  }

  function showBadge() {
    document.getElementById('quiz').style.display = 'none';
    document.getElementById('badge').style.display = 'block';
    document.getElementById('particles').setAttribute('visible','true');
  }
  function hideBadge() {
    document.getElementById('badge').style.display='none';
    current=0; score=0;
    document.getElementById('pts').textContent=0;
  }
  </script>
</body>
</html>
