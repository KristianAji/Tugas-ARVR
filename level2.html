<a-marker type="pattern" url="marker.patt">

    animation="property:rotation;to:0 360 0;loop:true;dur:4000;easing:linear">

      animation="property:scale;from:1 1 1;to:1.2 1.2 1.2;
      loop:true;dir:alternate;dur:600"></a-sphere>

    position="0 1.3 0" color="#ff5722" width="3"></a-text>

  <!-- Panel email palsu dalam AR -->
  <a-plane position="0 0 -0.1" width="2" height="1.4" color="#fff">

Subjek: AKUN ANDA DIBLOKIR!

http://bit.ly/konfirmasi123

[KLIK LINK]" 
      align="left" position="-0.85 0.4 0.01" 
      color="#333" width="3.5" wrap-count="32"></a-text>
  </a-plane>

  <!-- Indikator bahaya -->
  <a-entity position="1.2 0 0">

• Domain typo
